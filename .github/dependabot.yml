version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    # Integration test fixtures pin their dependency versions on purpose:
    # the postbuild assertions and expected XML files contain those versions
    # verbatim, so a bump there is always red until the assertions are updated.
    exclude-paths:
      - "src/it/**"
      - "src/it-repo/**"
    schedule:
      interval: "monthly"
    groups:
      maven:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Stay on the Maven 3.9.x line; 3.10 is not the plugin baseline yet
      - dependency-name: "org.apache.maven:maven-artifact"
        versions: [">= 3.10.0"]
      - dependency-name: "org.apache.maven:maven-core"
        versions: [">= 3.10.0"]
      - dependency-name: "org.apache.maven:maven-model"
        versions: [">= 3.10.0"]
      - dependency-name: "org.apache.maven:maven-plugin-api"
        versions: [">= 3.10.0"]
      # wiremock 3 requires Java 11; the integration tests still run on Java 8.
      - dependency-name: "com.github.tomakehurst:wiremock-jre8-standalone"
        versions: ["[3.0.0,)"]
      # Maven Resolver 2.x targets Maven 4
      - dependency-name: "org.apache.maven.resolver:*"
        versions: [">= 2.0"]
      # SLF4J 2.x requires SLF4JServiceProvider, incompatible with Maven 3 runtime
      - dependency-name: "org.slf4j:*"
        versions: [">= 2.0"]
      # Mockito 5 requires Java 11; the build still runs on Java 8.
      - dependency-name: "org.mockito:*"
        versions: [">= 5.0.0"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns: ["*"]
