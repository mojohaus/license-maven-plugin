# URLs of well-known licenses that the download-licenses goals answer from a text bundled with the plugin
# instead of requesting the license host. See BundledLicenseTexts and the license.useBundledLicenseTexts parameter.
#
# Key:   host and path of the URL. http and https are the same entry, a leading www. is ignored. No query.
# Value: <kind>:<id>. The id is a directory under META-INF/licenses/ that contains license.txt.
#   text  the URL returns plain text. Served with the default setting.
#   page  the URL returns an HTML page. Served only when license.useBundledLicenseTexts is "all".
#
# Add an entry only after fetching the URL once and comparing its text with the bundled one. The bundled texts of
# the GPL 1.0 and 2.0, the LGPL 2.1 and the FDL 1.3 date from before the FSF replaced the postal address and the
# "copyleft" URL in its files; the entries below map to them nevertheless because only those lines differ.

# --- gnu.org plain text
gnu.org/licenses/gpl-3.0.txt=text:gpl_v3
gnu.org/licenses/lgpl-3.0.txt=text:lgpl_v3
gnu.org/licenses/agpl-3.0.txt=text:agpl_v3
gnu.org/licenses/fdl-1.3.txt=text:fdl_v1_3
# redirects to old-licenses/
gnu.org/licenses/gpl-2.0.txt=text:gpl_v2
gnu.org/licenses/lgpl-2.1.txt=text:lgpl_v2_1
gnu.org/licenses/old-licenses/gpl-1.0.txt=text:gpl_v1
gnu.org/licenses/old-licenses/gpl-2.0.txt=text:gpl_v2
gnu.org/licenses/old-licenses/lgpl-2.1.txt=text:lgpl_v2_1

# --- apache.org plain text (LICENSE-2.0 without extension is served as text/plain)
apache.org/licenses/LICENSE-2.0.txt=text:apache_v2
apache.org/licenses/LICENSE-2.0=text:apache_v2

# --- eclipse.org plain text
eclipse.org/org/documents/epl-2.0/EPL-2.0.txt=text:epl_only_v2

# --- gnu.org pages
gnu.org/licenses/gpl-3.0.html=page:gpl_v3
gnu.org/licenses/lgpl-3.0.html=page:lgpl_v3
gnu.org/licenses/agpl-3.0.html=page:agpl_v3
gnu.org/licenses/old-licenses/gpl-2.0.html=page:gpl_v2
gnu.org/licenses/old-licenses/lgpl-2.1.html=page:lgpl_v2_1

# --- apache.org page
apache.org/licenses/LICENSE-2.0.html=page:apache_v2

# --- eclipse.org pages (the first of each pair redirects to the second)
eclipse.org/legal/epl-v10.html=page:epl_only_v1
eclipse.org/legal/epl/epl-v10.html=page:epl_only_v1
eclipse.org/legal/epl-v20.html=page:epl_only_v2
eclipse.org/legal/epl/epl-v20.html=page:epl_only_v2
